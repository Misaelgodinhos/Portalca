const setMeta=(name,content)=>{let m=document.querySelector('meta[name="'+name+'"]');if(!m){m=document.createElement('meta');m.name=name;document.head.append(m)}m.content=content||''};
const readTime=t=>Math.max(1,Math.ceil(String(t||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).length/220));
function shareButtons(p){const el=document.getElementById('share');if(!el)return;el.onclick=async()=>{const url=location.href;if(navigator.share){try{await navigator.share({title:p.title,text:p.excerpt||'',url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);el.textContent='✓ Link copiado'}catch{window.open('https://wa.me/?text='+encodeURIComponent(p.title+' '+url),'_blank','noopener')}};const wa=document.getElementById('whatsapp');if(wa)wa.href='https://wa.me/?text='+encodeURIComponent(p.title+' '+location.href)}
async function related(currentId){try{const posts=await caPublished();const found=posts.filter(p=>p.id!==currentId).slice(0,3);if(!found.length)return;const container=document.getElementById('relatedList');container.replaceChildren();for(const p of found){const a=document.createElement('a');a.className='related-card';a.href='article.html?id='+encodeURIComponent(p.id);const category=document.createElement('span');category.className='kicker';category.textContent=p.category||'Notícias';const title=document.createElement('h3');title.textContent=p.title;a.append(category,title);if(safeImage(p.image_url)){const img=document.createElement('img');img.src=p.image_url;img.alt='';img.loading='lazy';a.prepend(img)}container.append(a)}document.getElementById('related').hidden=false}catch(e){console.warn('Notícias relacionadas indisponíveis',e)}}
addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;document.getElementById('readProgress').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'},{passive:true});
function setSocial(p){const update=(selector,value)=>{let el=document.querySelector(selector);if(!el){el=document.createElement('meta');const property=selector.match(/property="([^"]+)"/);if(property)el.setAttribute('property',property[1]);document.head.append(el)}el.setAttribute('content',value||'')};update('meta[property="og:title"]',p.title);update('meta[property="og:description"]',p.excerpt);update('meta[property="og:url"]',location.href);if(safeImage(p.image_url))update('meta[property="og:image"]',p.image_url);let canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=location.href}
function initBookmark(id){const button=document.getElementById('bookmark');if(!button)return;const key='portalca-bookmarks-v1';const get=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}};function update(){const active=get().includes(id);button.textContent=active?'★ Salva':'☆ Salvar';button.setAttribute('aria-pressed',String(active))}button.onclick=()=>{let ids=get();ids=ids.includes(id)?ids.filter(x=>x!==id):[id,...ids];try{localStorage.setItem(key,JSON.stringify(ids))}catch{}update()};update()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeImage(src){try{const u=new URL(src);return u.protocol==='https:'&&u.origin===new URL(CA.url).origin&&u.pathname.startsWith('/storage/v1/object/public/portal-ca-images/')}catch{return false}}
function safeBody(body){const marker='<!--portal-ca-rich-->';if(!body?.startsWith(marker))return '<p>'+esc(body||'').replace(/\n/g,'<br>')+'</p>';const d=new DOMParser().parseFromString(body.slice(marker.length),'text/html');const allowed=new Set(['P','DIV','BR','B','STRONG','I','EM','U','H2','H3','UL','OL','LI','BLOCKQUOTE','A','FIGURE','FIGCAPTION','IMG']);function walk(n){for(const c of [...n.childNodes]){if(c.nodeType===3)continue;if(c.nodeType!==1){c.remove();continue}walk(c);if(!allowed.has(c.tagName)){c.replaceWith(...c.childNodes);continue}const href=c.getAttribute('href'),src=c.getAttribute('src'),alt=c.getAttribute('alt');for(const a of [...c.attributes])c.removeAttribute(a.name);if(c.tagName==='IMG'){if(safeImage(src)){c.setAttribute('src',src);c.setAttribute('alt',alt||'Imagem da reportagem');c.setAttribute('loading','lazy')}else c.remove()}if(c.tagName==='A'){if(/^https:\/\//i.test(href||'')){c.setAttribute('href',href);c.setAttribute('rel','noopener noreferrer');c.setAttribute('target','_blank')}else c.replaceWith(...c.childNodes)}}}walk(d.body);return d.body.innerHTML}
(async()=>{const id=new URLSearchParams(location.search).get('id');if(id&&!/^[0-9a-f-]{36}$/i.test(id)){let p;try{p=JSON.parse(sessionStorage.getItem('portalca_local_article')||'null')}catch{}if(p&&String(p.id)===id){document.title=p.title+' | Portal CA';setMeta('description',p.excerpt||p.title);const isDemo=!!p.demo;document.getElementById('article').innerHTML=(isDemo?'<div class="notice"><strong>CONTEÚDO DEMONSTRATIVO.</strong> Esta reportagem é fictícia e não descreve um acontecimento real.</div>':'<div class="notice">Esta matéria está disponível apenas neste navegador.</div>')+'<div class="kicker">'+esc(p.category||'Notícia')+'</div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt)+'</p><div class="byline">Portal CA · '+esc(p.date||'')+'</div>'+(safeImage(p.image_url)?'<img class="cover" alt="Imagem da notícia" src="'+esc(p.image_url)+'">':'')+'<div class="body">'+safeBody(p.body)+'</div>';return}}if(id&&id.startsWith('demo')){let p;try{p=JSON.parse(sessionStorage.getItem('portalca_demo_article')||'null')}catch{}if(p&&p.id===id){document.title=p.title+' | Demonstração | Portal CA';document.querySelector('meta[name="description"]').content='Conteúdo demonstrativo do Portal CA';document.getElementById('article').innerHTML='<div class="notice"><strong>CONTEÚDO DEMONSTRATIVO.</strong> Esta reportagem é fictícia e não descreve um acontecimento real.</div><div class="kicker">'+esc(p.category)+' · DEMONSTRAÇÃO</div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt)+'</p><div class="byline">Portal CA · Exemplo de reportagem</div><div class="body">'+safeBody(p.body)+'</div>';return}}if(!id||!/^[0-9a-f-]{36}$/i.test(id)){document.getElementById('article').innerHTML='<div class="notice">Matéria não encontrada. <a href="index.html">Voltar ao jornal</a>.</div>';return}try{const result=await caRequest('/rest/v1/portal_ca_articles?select=id,title,category,excerpt,body,image_url,created_at&status=eq.published&id=eq.'+encodeURIComponent(id)+'&limit=1');const p=result[0];if(!p)throw Error('Notícia não encontrada');document.title=p.title+' | Portal CA';setMeta('description',p.excerpt||p.title);const date=new Date(p.created_at).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});const content=document.getElementById('article');content.innerHTML='<div class="kicker">'+esc(p.category)+'</div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt)+'</p><div class="byline"><span><strong>Redação Portal CA</strong><span class="byline-extra"> · '+esc(date)+' · '+readTime(p.body)+' min de leitura</span></span><div class="share-actions"><button type="button" id="bookmark" class="share" aria-pressed="false">☆ Salvar</button><a id="whatsapp" class="share whatsapp" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a><button class="share" id="share">Compartilhar ↗</button></div></div>'+(safeImage(p.image_url)?'<img class="cover" alt="Imagem da reportagem" src="'+esc(p.image_url)+'">':'')+'<div class="body">'+safeBody(p.body)+'</div>';shareButtons(p);initBookmark(id);setSocial(p);related(id);try{const k='portalca-reads-v1',views=JSON.parse(localStorage.getItem(k)||'{}');views[id]=(views[id]||0)+1;localStorage.setItem(k,JSON.stringify(views))}catch{}}catch(e){document.getElementById('article').innerHTML='<div class="notice">Não foi possível carregar esta reportagem. <a href="index.html">Voltar ao jornal</a>.</div>'}})();
