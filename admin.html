<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Portal CA</title><link rel="stylesheet" href="styles.css"></head><body><div class="top"><div class="wrap">PORTAL CA • ADMINISTRAÇÃO</div></div><main class="wrap"><p><a href="index.html">← Voltar ao jornal</a></p><h1>Painel editorial</h1><div class="notice">A publicação online exige conta autorizada como editora no Supabase. Notícias demonstrativas continuam identificadas no portal.</div><section id="login" class="editor"><h2>Entrar</h2><form id="loginForm"><label>E-mail</label><input type="email" id="email" required autocomplete="username"><label>Senha</label><input type="password" id="password" required autocomplete="current-password"><p><button>Entrar</button></p></form></section><div id="workspace" hidden><p><button class="secondary" id="logout">Sair</button></p><section class="editor"><h2 id="formTitle">Nova matéria</h2><form id="form"><input type="hidden" id="id"><label>Título</label><input id="title" required maxlength="160"><label>Categoria</label><select id="category"><option>Cidade</option><option>Política</option><option>Economia</option><option>Cultura</option><option>Esporte</option><option>Segurança</option></select><label>Resumo</label><textarea id="excerpt" required></textarea><label>Texto completo</label><textarea id="body" required></textarea><label>Status</label><select id="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select><p><button>Salvar online</button> <button type="button" class="secondary" id="reset">Limpar</button></p></form></section><section class="editor"><h2>Matérias online</h2><div id="list"></div></section></div><p id="message" role="status"></p></main><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="admin-cloud.js"></script></body></html>
