<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b70c24"><meta name="description" content="Notícias de Cachoeira Alta, Goiás, no Portal CA."><title>Notícia | Portal CA</title><style>
:root{--red:#b70c24;--ink:#19212b;--muted:#697381;--line:#e9edf0}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.shell{width:min(100% - 36px,1140px);margin:auto}.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.top .shell{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:850;letter-spacing:-.6px}.brand b{background:var(--red);color:white;padding:10px;border-radius:9px}.back{font-size:13px;color:var(--muted);font-weight:650}.article{max-width:780px;margin:48px auto 90px}.kicker{font-size:11px;color:var(--red);font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.article h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,58px);letter-spacing:-1.5px;line-height:1.13;margin:15px 0 20px}.excerpt{font-size:clamp(17px,2.3vw,21px);line-height:1.6;color:#596575;margin-bottom:20px}.byline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.byline strong{color:var(--ink)}button{font:inherit;cursor:pointer}.share{border:1px solid #e4e8ed;border-radius:9px;padding:10px 13px;background:#fff;color:var(--red);font-weight:750}.cover{display:block;width:100%;max-height:510px;object-fit:cover;border-radius:11px;margin:26px 0}.body{font-family:Georgia,serif;font-size:19px;line-height:1.85;overflow-wrap:anywhere}.body p{margin:0 0 1.3em}.body h2{font-size:30px;line-height:1.3;margin:36px 0 16px}.body blockquote{border-left:4px solid var(--red);padding:6px 20px;margin:25px 0;color:#536071}.body a{color:var(--red);text-decoration:underline}.body figure{margin:30px 0}.body img{display:block;max-width:100%;height:auto;border-radius:10px}.body figcaption{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}.foot{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:12px}.notice{padding:20px;border:1px solid #f1d4d9;border-radius:12px;background:#fff8f9;color:#8d2336}#state{padding-top:20px;color:var(--muted)}@media(max-width:700px){.top .shell{min-height:62px}.brand{font-size:16px}.brand b{padding:8px}.article{margin:28px auto 60px}.article h1{letter-spacing:-.8px}.body{font-size:18px}.cover{border-radius:8px}.byline{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header class="top"><div class="shell"><a class="brand" href="index.html"><b>CA</b> PORTAL CA</a><a class="back" href="index.html">← Voltar ao jornal</a></div></header><main class="shell"><article class="article" id="article"><p id="state">Carregando reportagem...</p></article></main><footer class="foot"><div class="shell">Portal CA · Cachoeira Alta, Goiás · Jornalismo local</div></footer><script src="supabase-config.js"></script><script src="supabase-client.js?v=20261112-5"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeImage(src){try{const u=new URL(src);return u.protocol==='https:'&&u.origin===new URL(CA.url).origin&&u.pathname.startsWith('/storage/v1/object/public/portal-ca-images/')}catch{return false}}
function safeBody(body){const marker='<!--portal-ca-rich-->';if(!body?.startsWith(marker))return '<p>'+esc(body||'').replace(/\n/g,'<br>')+'</p>';const d=new DOMParser().parseFromString(body.slice(marker.length),'text/html');const allowed=new Set(['P','DIV','BR','B','STRONG','I','EM','U','H2','H3','UL','OL','LI','BLOCKQUOTE','A','FIGURE','FIGCAPTION','IMG']);function walk(n){for(const c of [...n.childNodes]){if(c.nodeType===3)continue;if(c.nodeType!==1){c.remove();continue}walk(c);if(!allowed.has(c.tagName)){c.replaceWith(...c.childNodes);continue}const href=c.getAttribute('href'),src=c.getAttribute('src'),alt=c.getAttribute('alt');for(const a of [...c.attributes])c.removeAttribute(a.name);if(c.tagName==='IMG'){if(safeImage(src)){c.setAttribute('src',src);c.setAttribute('alt',alt||'Imagem da reportagem');c.setAttribute('loading','lazy')}else c.remove()}if(c.tagName==='A'){if(/^https:\/\//i.test(href||'')){c.setAttribute('href',href);c.setAttribute('rel','noopener noreferrer');c.setAttribute('target','_blank')}else c.replaceWith(...c.childNodes)}}}walk(d.body);return d.body.innerHTML}
(async()=>{const id=new URLSearchParams(location.search).get('id');if(id&&id.startsWith('demo')){let p;try{p=JSON.parse(sessionStorage.getItem('portalca_demo_article')||'null')}catch{}if(p&&p.id===id){document.title=p.title+' | Demonstração | Portal CA';document.querySelector('meta[name="description"]').content='Conteúdo demonstrativo do Portal CA';document.getElementById('article').innerHTML='<div class="notice"><strong>CONTEÚDO DEMONSTRATIVO.</strong> Esta reportagem é fictícia e não descreve um acontecimento real.</div><div class="kicker">'+esc(p.category)+' · DEMONSTRAÇÃO</div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt)+'</p><div class="byline">Portal CA · Exemplo de reportagem</div><div class="body">'+safeBody(p.body)+'</div>';return}}if(!id||!/^[0-9a-f-]{36}$/i.test(id)){document.getElementById('article').innerHTML='<div class="notice">Matéria não encontrada. <a href="index.html">Voltar ao jornal</a>.</div>';return}try{const result=await caRequest('/rest/v1/portal_ca_articles?select=id,title,category,excerpt,body,image_url,created_at&status=eq.published&id=eq.'+encodeURIComponent(id)+'&limit=1');const p=result[0];if(!p)throw Error('Notícia não encontrada');document.title=p.title+' | Portal CA';document.querySelector('meta[name="description"]').content=p.excerpt||p.title;const date=new Date(p.created_at).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});const content=document.getElementById('article');content.innerHTML='<div class="kicker">'+esc(p.category)+'</div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt)+'</p><div class="byline"><span><strong>Portal CA</strong> · '+esc(date)+'</span><button class="share" id="share">Compartilhar ↗</button></div>'+(safeImage(p.image_url)?'<img class="cover" alt="Imagem da reportagem" src="'+esc(p.image_url)+'">':'')+'<div class="body">'+safeBody(p.body)+'</div>';document.getElementById('share').onclick=async()=>{const url=location.href;if(navigator.share){try{await navigator.share({title:p.title,text:p.excerpt,url})}catch{}}else{try{await navigator.clipboard.writeText(url);document.getElementById('share').textContent='Link copiado ✓'}catch{window.open('https://wa.me/?text='+encodeURIComponent(p.title+' '+url),'_blank','noopener')}}};try{const k='portalca-reads-v1',views=JSON.parse(localStorage.getItem(k)||'{}');views[id]=(views[id]||0)+1;localStorage.setItem(k,JSON.stringify(views))}catch{}}catch(e){document.getElementById('article').innerHTML='<div class="notice">Não foi possível carregar esta reportagem. <a href="index.html">Voltar ao jornal</a>.</div>'}})();
</script></body></html>
